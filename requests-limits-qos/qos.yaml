apiVersion: v1
kind: Pod
metadata:
  name: guaranteed
  namespace: qos
spec:
  nodeSelector: {kubernetes.io/hostname: lab-worker}
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 100m, memory: 64Mi}
        limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: burstable
  namespace: qos
spec:
  nodeSelector: {kubernetes.io/hostname: lab-worker}
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 50m, memory: 32Mi}
        limits: {memory: 64Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: besteffort
  namespace: qos
spec:
  nodeSelector: {kubernetes.io/hostname: lab-worker}
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
