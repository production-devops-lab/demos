apiVersion: apps/v1
kind: Deployment
metadata: {name: app, namespace: team-a}
spec:
  replicas: 3
  selector: {matchLabels: {app: app}}
  template:
    metadata: {labels: {app: app}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          resources:
            requests: {cpu: 300m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
