apiVersion: v1
kind: Pod
metadata:
  name: tuned
  namespace: shop
spec:
  dnsPolicy: ClusterFirst
  dnsConfig:
    searches: [billing.svc.cluster.local]
    options: [{name: ndots, value: "2"}]
  containers:
    - name: dig
      image: registry.k8s.io/e2e-test-images/jessie-dnsutils:1.3
      command: ["sleep", "3600"]
